name: Bam Builds

on:
  push:
    branches-ignore:
      - 'main'
      - 'release/**'
    # This will trigger for all branches except main and release branches,
    # including 'develop' and any feature branches like 'feature/*' or 'hotfix/*'.
  pull_request:
    branches: [ develop ] # Also trigger for PRs specifically targeting develop for additional context if needed

env:
  CARGO_TERM_COLOR: always
  # BUILD_TYPE will now be set in the 'build' job using the output of the 'setup' job.

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.determine_build_type.outputs.build_type }}
      build_name_prefix: ${{ steps.determine_build_type.outputs.build_name_prefix }}
    steps:
      - name: Determine Build Type
        id: determine_build_type
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "build_type=beta" >> $GITHUB_OUTPUT
            echo "build_name_prefix=Beta" >> $GITHUB_OUTPUT
          else
            echo "build_type=alpha" >> $GITHUB_OUTPUT
            echo "build_name_prefix=Alpha" >> $GITHUB_OUTPUT
          fi

  build:
    name: ${{ needs.setup.outputs.build_name_prefix }} Build (${{ matrix.artifact_name }})
    needs: setup
    runs-on: ${{ matrix.os }}
    env: # Set BUILD_TYPE at the job level for steps to use
      BUILD_TYPE: ${{ needs.setup.outputs.build_type }}
    strategy:
      fail-fast: false # Ensure all matrix jobs run even if one fails (especially for Alpha builds)
      matrix:
        include:
          - os: ubuntu-latest
            lld_name: ld.lld # Generic name for lld, actual file might be rust-lld
            artifact_name: x86_64-unknown-linux-musl
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            lld_name: ld.lld
            artifact_name: aarch64-apple-darwin
            target: aarch64-apple-darwin
          - os: windows-latest
            lld_name: ld.lld.exe # Generic name for lld, actual file might be rust-lld.exe
            artifact_name: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for version calculation (beta count, branch name)

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ env.BUILD_TYPE }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }} # Add SHA to key for more specific caching
          restore-keys: |
            ${{ runner.os }}-${{ env.BUILD_TYPE }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-${{ env.BUILD_TYPE }}-cargo-build-target-


      - name: Determine Branch Name
        id: branch_name
        shell: bash
        run: |
          # GITHUB_HEAD_REF is only set for pull request events.
          # For push events, GITHUB_REF_NAME contains the branch name.
          if [[ -n "${{ github.head_ref }}" ]]; then
            BRANCH_NAME="${{ github.head_ref }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          # Sanitize branch name for use in versions/filenames (replace / with -)
          SANITIZED_BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's|/|-|g')
          echo "branch_name=${SANITIZED_BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "Original branch name: $BRANCH_NAME"
          echo "Sanitized branch name: $SANITIZED_BRANCH_NAME"

      - name: Generate Version
        id: version
        shell: bash
        run: |
          BASE_VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_VERSION=""

          if [[ "${{ env.BUILD_TYPE }}" == "beta" ]]; then
            # For Beta (develop branch)
            BETA_COUNT=$(git rev-list --count ${{ github.ref_name }}) # Count commits on develop
            BUILD_VERSION="${BASE_VERSION}-beta.${BETA_COUNT}.${SHORT_SHA}"
            echo "Generated Beta version: ${BUILD_VERSION}"
          else
            # For Alpha (feature branches)
            BRANCH_NAME_FROM_STEP="${{ steps.branch_name.outputs.branch_name }}"
            # Using github.run_number as N for the build number
            BUILD_NUMBER="${{ github.run_number }}"
            BUILD_VERSION="${BASE_VERSION}-alpha.${BRANCH_NAME_FROM_STEP}.${BUILD_NUMBER}.${SHORT_SHA}"
            echo "Generated Alpha version: ${BUILD_VERSION}"
          fi
          echo "version=${BUILD_VERSION}" >> $GITHUB_OUTPUT

      - name: Update version in Cargo.toml
        shell: bash
        run: |
          sed -i.bak "s/^version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/" Cargo.toml
          echo "Updated Cargo.toml version to: ${{ steps.version.outputs.version }}"

      - name: Run tests
        run: cargo test --verbose

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Check Formatting
        run: cargo fmt -- --check

      - name: Install Rust target
        shell: bash
        run: |
          if [[ -n "${{ matrix.target }}" ]]; then
            rustup target add ${{ matrix.target }}
          else
            echo "No specific target in matrix, assuming native build."
          fi

      - name: Build bam
        shell: bash
        env:
          RUSTFLAGS: ${{ (matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'x86_64-pc-windows-msvc') && '-C target-feature=+crt-static' || '' }}
        run: |
          if [[ -n "${{ matrix.target }}" ]]; then
            cargo build --release --target ${{ matrix.target }}
          else
            cargo build --release
          fi

      - name: Determine Bam Executable Name and Path
        id: bam_exe
        shell: bash
        run: |
          BAM_EXE_NAME="bam"
          [[ "${{ matrix.os }}" == "windows-latest" ]] && BAM_EXE_NAME="bam.exe"
          echo "bam_exe_name=$BAM_EXE_NAME" >> $GITHUB_OUTPUT

          if [[ -n "${{ matrix.target }}" ]]; then
            SOURCE_BAM_PATH="target/${{ matrix.target }}/release/$BAM_EXE_NAME"
          else
            SOURCE_BAM_PATH="target/release/$BAM_EXE_NAME"
          fi
          echo "source_bam_path=$SOURCE_BAM_PATH" >> $GITHUB_OUTPUT

      - name: Setup LLD Download Information
        id: lld_info
        shell: bash
        run: |
          LLVM_EXTRACT_DIR="llvm_downloaded" # A common parent directory for extraction
          mkdir -p "$LLVM_EXTRACT_DIR"
          echo "LLVM_EXTRACT_DIR=$LLVM_EXTRACT_DIR" >> $GITHUB_ENV

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            echo "LLVM_VERSION_ID=llvm-mingw-20250319-ucrt-x86_64" >> $GITHUB_ENV
            echo "LLVM_TARBALL_NAME=llvm-mingw-20250319-ucrt-x86_64.zip" >> $GITHUB_ENV
            echo "LLVM_DOWNLOAD_URL=https://github.com/mstorsjo/llvm-mingw/releases/download/20250319/llvm-mingw-20250319-ucrt-x86_64.zip" >> $GITHUB_ENV
            # The mingw zip unpacks into a top-level llvm-mingw-*-ucrt-x86_64 folder
            echo "LLVM_BIN_SUBPATH=${{ env.LLVM_TARBALL_NAME%.zip }}/bin" >> $GITHUB_ENV
            echo "EXTRACTED_LLD_NAME=ld.lld.exe" >> $GITHUB_ENV
            echo "PACKAGED_LLD_NAME=ld.lld.exe" >> $GITHUB_ENV
            echo "LIB_SUBPATH=x86_64-w64-mingw32/lib" >> $GITHUB_ENV
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            echo "LLVM_VERSION_ID=llvmorg-20.1.1" >> $GITHUB_ENV
            echo "LLVM_TARBALL_NAME=LLVM-20.1.1-macOS-ARM64.tar.xz" >> $GITHUB_ENV
            echo "LLVM_DOWNLOAD_URL=https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.1/LLVM-20.1.1-macOS-ARM64.tar.xz" >> $GITHUB_ENV
            echo "LLVM_BIN_SUBPATH=LLVM-20.1.1-macOS-ARM64/bin" >> $GITHUB_ENV
            echo "EXTRACTED_LLD_NAME=lld" >> $GITHUB_ENV
            echo "PACKAGED_LLD_NAME=lld" >> $GITHUB_ENV
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then # Linux
            echo "LLVM_VERSION_ID=static-clang-v20.1.1" >> $GITHUB_ENV
            echo "LLVM_TARBALL_NAME=linux_amd64.tar.xz" >> $GITHUB_ENV
            echo "LLVM_DOWNLOAD_URL=https://github.com/dzbarsky/static-clang/releases/download/v20.1.1/linux_amd64.tar.xz" >> $GITHUB_ENV
            # The static-clang linux_amd64.tar.xz extracts directly into `bin`, `lib`, etc.
            # So, if we extract to LLVM_EXTRACT_DIR, the path is LLVM_EXTRACT_DIR/bin/lld
            echo "LLVM_BIN_SUBPATH=bin" >> $GITHUB_ENV
            echo "EXTRACTED_LLD_NAME=lld" >> $GITHUB_ENV
            echo "PACKAGED_LLD_NAME=ld.lld" >> $GITHUB_ENV # Specific name for Linux as per request
          fi

      - name: Cache LLVM Tarball
        uses: actions/cache@v4
        id: cache_llvm_tarball
        with:
          path: ./${{ env.LLVM_TARBALL_NAME }}
          key: ${{ runner.os }}-${{ env.LLVM_VERSION_ID }}-${{ env.LLVM_TARBALL_NAME }}

      - name: Download LLVM Tarball
        if: steps.cache_llvm_tarball.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "Downloading ${{ env.LLVM_DOWNLOAD_URL }} to ${{ env.LLVM_TARBALL_NAME }}"
          curl -L -o "${{ env.LLVM_TARBALL_NAME }}" "${{ env.LLVM_DOWNLOAD_URL }}"

      - name: Extract and Package LLD
        shell: bash
        run: |
          PACKAGE_DIR="package"
          mkdir -p "$PACKAGE_DIR"

          echo "Extracting ${{ env.LLVM_TARBALL_NAME }} into ${{ env.LLVM_EXTRACT_DIR }}"
          # For archives that contain a top-level directory (macOS, Windows official LLVM)
          # we extract directly into LLVM_EXTRACT_DIR and the subpath will include that top-level dir.
          # For the static-clang linux one, it might extract its contents (bin/, lib/) directly.
          # If static-clang extracts contents directly, then LLVM_BIN_SUBPATH=bin is correct if LLVM_EXTRACT_DIR is the destination.
          # If it extracts into a subdirectory linux_amd64 within LLVM_EXTRACT_DIR, then LLVM_BIN_SUBPATH should be linux_amd64/bin.
          # Assuming static-clang `linux_amd64.tar.xz` top level is `bin/`, `lib/` etc.
          # So, if -C is ${{ env.LLVM_EXTRACT_DIR }}, then path is ${{ env.LLVM_EXTRACT_DIR }}/bin/lld
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z x "${{ env.LLVM_TARBALL_NAME }}" -o"${{ env.LLVM_EXTRACT_DIR }}"
          else
            tar -xf "${{ env.LLVM_TARBALL_NAME }}" -C "${{ env.LLVM_EXTRACT_DIR }}"
          fi

          SOURCE_LLD_PATH="$LLVM_EXTRACT_DIR/$LLVM_BIN_SUBPATH/$EXTRACTED_LLD_NAME"
          DEST_LLD_PATH="$PACKAGE_DIR/$PACKAGED_LLD_NAME"

          echo "Copying LLD from ${SOURCE_LLD_PATH} to ${DEST_LLD_PATH}"
          cp "${SOURCE_LLD_PATH}" "${DEST_LLD_PATH}"
          chmod +x "${DEST_LLD_PATH}"

          echo "Copying bam executable to package"
          cp "${{ steps.bam_exe.outputs.source_bam_path }}" "$PACKAGE_DIR/${{ steps.bam_exe.outputs.bam_exe_name }}"

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            echo "Copying mingw import-libs to package/lib"
            ARCHIVE_DIR="${LLVM_EXTRACT_DIR}/${LLVM_TARBALL_NAME%.zip}"
            mkdir -p "$PACKAGE_DIR/lib"
            cp "$ARCHIVE_DIR/${LIB_SUBPATH}/libmsvcrt.a" "$PACKAGE_DIR/lib/"
            cp "$ARCHIVE_DIR/${LIB_SUBPATH}/libkernel32.a" "$PACKAGE_DIR/lib/"
          fi

          echo "Package contents:"
          ls -la "$PACKAGE_DIR/"

          if [[ "${{ matrix.os }}" == 'macos-latest' ]]; then
            echo "Verifying dynamic dependencies of packaged LLD on macOS:"
            otool -L "$PACKAGE_DIR/${{ env.PACKAGED_LLD_NAME }}" # Should be package/lld
          fi

      - name: Test compilation end-to-end
        shell: bash
        run: |
          cd package
          TEST_MESSAGE="Hello from ${{ env.BUILD_TYPE }} build! Version: ${{ steps.version.outputs.version }}"
          echo "print(message: \"$TEST_MESSAGE\")" > test.bam

          echo "=== Testing object file generation ==="
          export KEEP_OBJECT_FILE=1
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ./${{ steps.bam_exe.outputs.bam_exe_name }} test.bam 2>&1 || true
            file test.o 2>/dev/null || echo "No test.o found or file command not available on Windows."
          else
            ./${{ steps.bam_exe.outputs.bam_exe_name }} test.bam 2>&1 || true
            file test.o 2>/dev/null || echo "No test.o found or file command not available."
          fi

          echo "=== Testing executable run ==="
          TEST_OUTPUT_EXE="test"
          [[ "${{ matrix.os }}" == "windows-latest" ]] && TEST_OUTPUT_EXE="test.exe"
          if [[ -f "$TEST_OUTPUT_EXE" ]]; then
            echo "Running $TEST_OUTPUT_EXE:"
            OUTPUT=$(./$TEST_OUTPUT_EXE)
            echo "$OUTPUT"
            if [[ "$OUTPUT" != "$TEST_MESSAGE" ]]; then
              echo "Error: End-to-end test output mismatch!"
              exit 1
            fi
          else
            echo "$TEST_OUTPUT_EXE not found - compilation likely failed."
            exit 1
          fi

      - name: Determine Archive Name
        id: archive_details
        shell: bash
        run: |
          VERSION_TAG="${{ steps.version.outputs.version }}"
          ARTIFACT_SUFFIX="${{ matrix.artifact_name }}"

          # For alpha builds, include the sanitized branch name in the zip for clarity, as requested
          # The version tag already includes it, but this makes the downloadable zip explicit.
          BRANCH_NAME_SUFFIX=""
          if [[ "${{ env.BUILD_TYPE }}" == "alpha" ]]; then
            BRANCH_NAME_SUFFIX="-${{ steps.branch_name.outputs.branch_name }}"
          fi

          ARCHIVE_BASENAME="bam-${VERSION_TAG}${BRANCH_NAME_SUFFIX}-${ARTIFACT_SUFFIX}"

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ARCHIVE_FILENAME="${ARCHIVE_BASENAME}.zip"
          else
            ARCHIVE_FILENAME="${ARCHIVE_BASENAME}.tar.gz"
          fi
          echo "archive_filename=${ARCHIVE_FILENAME}" >> $GITHUB_OUTPUT
          echo "Archive base name: ${ARCHIVE_BASENAME}"
          echo "Archive filename: ${ARCHIVE_FILENAME}"

      - name: Create Build Package
        shell: bash
        run: |
          cd package
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a "../${{ steps.archive_details.outputs.archive_filename }}" .
          else
            tar -czf "../${{ steps.archive_details.outputs.archive_filename }}" .
          fi
          cd ..
          echo "Created package: ${{ steps.archive_details.outputs.archive_filename }}"
          ls -la "${{ steps.archive_details.outputs.archive_filename }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_TYPE }}-build-${{ matrix.artifact_name }}-${{ steps.version.outputs.version }}
          path: ${{ steps.archive_details.outputs.archive_filename }}
          if-no-files-found: error # Fail if the artifact isn't found
          retention-days: ${{ (env.BUILD_TYPE == 'beta' && 30) || 7 }} # Longer retention for beta

      - name: Restore Cargo.toml
        if: always() # Always run this step
        shell: bash
        run: |
          if [[ -f Cargo.toml.bak ]]; then
            mv Cargo.toml.bak Cargo.toml
            echo "Restored Cargo.toml"
          else
            echo "Cargo.toml.bak not found, skipping restore."
          fi

  build-summary:
    name: Build Summary
    needs: [setup, build] # Also needs setup to get build_type
    runs-on: ubuntu-latest
    if: always() # Run even if builds fail to provide a summary
    env: # Make BUILD_TYPE available to this job's steps
      BUILD_TYPE: ${{ needs.setup.outputs.build_type }}
    steps:
      - name: Report build status
        shell: bash
        run: |
          BUILD_TYPE_UPPER=$(echo "${{ env.BUILD_TYPE }}" | awk '{print toupper($0)}')
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ All ${BUILD_TYPE_UPPER} builds completed successfully!"
            echo "Artifacts are available in the build summary."
          else
            echo "❌ Some ${BUILD_TYPE_UPPER} builds failed. Please check the logs."
            exit 1
          fi