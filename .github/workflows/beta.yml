name: Beta Builds

on:
  push:
    branches: [ develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  beta-build:
    name: Beta Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            lld_name: ld.lld
            artifact_name: x86_64-unknown-linux-gnu
          - os: macos-latest
            lld_name: ld.lld
            artifact_name: aarch64-apple-darwin
          - os: windows-latest
            lld_name: ld.lld.exe
            artifact_name: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for version calculation

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate beta version
        id: version
        shell: bash
        run: |
          # Get base version from Cargo.toml
          BASE_VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          
          # Count commits on develop since last tag to generate beta number
          BETA_COUNT=$(git rev-list --count HEAD ^$(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD~1000") 2>/dev/null || echo "1")
          
          # Create beta version
          BETA_VERSION="${BASE_VERSION}-beta.${BETA_COUNT}"
          echo "version=${BETA_VERSION}" >> $GITHUB_OUTPUT
          echo "Beta version: ${BETA_VERSION}"

      - name: Update version in Cargo.toml
        shell: bash
        run: |
          # Temporarily update version for beta build
          sed -i.bak 's/^version = ".*"/version = "${{ steps.version.outputs.version }}"/' Cargo.toml

      - name: Run tests
        run: cargo test

      - name: Build bam
        run: cargo build --release

      - name: Create package with rust-lld symlink
        shell: bash
        run: |
          # Get the host toolchain directory (rust-lld is in host toolchain, not target-specific)
          HOST_LIBDIR=$(rustc --print target-libdir)
          echo "Host lib dir: $HOST_LIBDIR"
          
          # Find rust-lld in the host toolchain
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            RUST_LLD_PATH="$HOST_LIBDIR/../bin/rust-lld.exe"
          else
            RUST_LLD_PATH="$HOST_LIBDIR/../bin/rust-lld"
          fi
          
          echo "Looking for rust-lld at: $RUST_LLD_PATH"
          
          if [[ -f "$RUST_LLD_PATH" ]]; then
            echo "Found rust-lld, creating symlink in package"
            mkdir -p package
            
            # Create symlink to toolchain rust-lld instead of copying
            # This ensures we use the version with proper shared library dependencies
            if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
              # Windows doesn't support symlinks in the same way, so copy for now
              cp "$RUST_LLD_PATH" "package/rust-lld.exe"
            else
              # Create symlink to system rust-lld
              ln -sf "$RUST_LLD_PATH" "package/rust-lld"
            fi
            
            # Copy bam executable  
            if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
              cp "target/release/bam.exe" "package/"
            else
              cp "target/release/bam" "package/"
            fi
            
            echo "Package contents:"
            ls -la package/
          else
            echo "Error: rust-lld not found at $RUST_LLD_PATH"
            exit 1
          fi


      - name: Test compilation end-to-end
        shell: bash
        run: |
          cd package
          
          # Create test program
          echo 'print(message: "Hello from beta build!")' > test.bam
          
          echo "=== Testing object file generation ==="
          # First, let's see what object file format we generate
          export KEEP_OBJECT_FILE=1
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ./bam.exe test.bam 2>&1 || true
            echo "Object file format check:"
            file test.o 2>/dev/null || echo "No test.o found or file command not available"
          else
            ./bam test.bam 2>&1 || true
            echo "Object file format check:"
            file test.o 2>/dev/null || echo "No test.o found or file command not available"
          fi
          
          echo "=== Testing executable run ==="
          # Test running the executable if it was created
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            if [[ -f "test.exe" ]]; then
              echo "Running test.exe:"
              ./test.exe
            else
              echo "test.exe not found - compilation failed"
            fi
          else
            if [[ -f "test" ]]; then
              echo "Running test:"
              ./test
            else
              echo "test executable not found - compilation failed"
            fi
          fi

      - name: Create beta package
        shell: bash
        run: |
          cd package
          
          # Create platform-specific archive
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Create ZIP for Windows
            7z a "../bam-${{ steps.version.outputs.version }}-${{ matrix.artifact_name }}.zip" .
          else
            # Create tar.gz for Unix-like systems
            tar -czf "../bam-${{ steps.version.outputs.version }}-${{ matrix.artifact_name }}.tar.gz" .
          fi
          
          cd ..
          echo "Created beta package:"
          ls -la bam-${{ steps.version.outputs.version }}-${{ matrix.artifact_name }}.*

      - name: Upload beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-${{ matrix.artifact_name }}-${{ steps.version.outputs.version }}
          path: |
            bam-${{ steps.version.outputs.version }}-${{ matrix.artifact_name }}.tar.gz
            bam-${{ steps.version.outputs.version }}-${{ matrix.artifact_name }}.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: Restore Cargo.toml
        shell: bash
        run: |
          # Restore original Cargo.toml
          mv Cargo.toml.bak Cargo.toml

  beta-summary:
    name: Beta Build Summary
    needs: beta-build
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - uses: actions/checkout@v4

      - name: Generate beta version
        id: version
        shell: bash
        run: |
          # Get base version from Cargo.toml
          BASE_VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          
          # Count commits on develop since last tag to generate beta number
          BETA_COUNT=$(git rev-list --count HEAD ^$(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD~1000") 2>/dev/null || echo "1")
          
          # Create beta version
          BETA_VERSION="${BASE_VERSION}-beta.${BETA_COUNT}"
          echo "version=${BETA_VERSION}" >> $GITHUB_OUTPUT

      - name: Create beta release
        if: needs.beta-build.result == 'success'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: bam ${{ steps.version.outputs.version }} (Beta)
          body: |
            ## bam ${{ steps.version.outputs.version }} (Beta)
            
            **⚠️ This is a beta release for testing purposes only.**
            
            Beta builds are created automatically from the `develop` branch and may contain:
            - Unreleased features
            - Known bugs
            - Breaking changes
            
            ### Installation
            
            Download the appropriate package for your platform:
            - Linux: `bam-${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz`
            - macOS: `bam-${{ steps.version.outputs.version }}-x86_64-apple-darwin.tar.gz`
            - Windows: `bam-${{ steps.version.outputs.version }}-x86_64-pc-windows-msvc.zip`
            
            ### Testing
            
            ```bash
            # Extract and test
            tar -xzf bam-*.tar.gz  # or unzip for Windows
            echo 'print(message: "Hello, World!")' > hello.bam
            ./bam hello.bam
            ./hello
            ```
            
            ### Feedback
            
            Please report issues and feedback on GitHub Issues.
            
            ---
            
            **Commit**: ${{ github.sha }}
            **Branch**: develop
          draft: false
          prerelease: true

      - name: Download all beta artifacts
        if: needs.beta-build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: beta-artifacts

      - name: Upload release assets
        if: needs.beta-build.result == 'success'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the release upload URL
          RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.version }}" | \
            jq -r '.id')
          
          # Upload each artifact
          for artifact_dir in beta-artifacts/*/; do
            for file in "$artifact_dir"*; do
              if [[ -f "$file" ]]; then
                filename=$(basename "$file")
                echo "Uploading $filename..."
                curl -s -H "Authorization: token $GITHUB_TOKEN" \
                  -H "Content-Type: application/octet-stream" \
                  --data-binary @"$file" \
                  "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$filename"
              fi
            done
          done

      - name: Report beta build status
        shell: bash
        run: |
          if [[ "${{ needs.beta-build.result }}" == "success" ]]; then
            echo "✅ Beta build ${{ steps.version.outputs.version }} published successfully!"
            echo "🔗 Available at: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}"
          else
            echo "❌ Beta build failed."
            exit 1
          fi